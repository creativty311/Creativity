<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Administrator Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
:root {
    --bg-dark: #080d1a;
    --card-bg: rgba(15, 23, 42, 0.75);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent-purple: #8b5cf6;
    --accent-indigo: #6366f1;
    --accent-blue: #3b82f6;
    --accent-red: #ef4444;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}

* {
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
}

body {
    text-align: center;
    background-color: var(--bg-dark);
    /* خلفية شبكية برمجية بلمسات نيون بنفسجية */
    background-image: 
        radial-gradient(circle at 80% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 35px 35px, 35px 35px;
    background-attachment: fixed;
    color: var(--text-main);
    padding: 40px 20px;
    min-height: 100vh;
    position: relative;
}

/* زر العودة للرئيسية */
.home-btn {
    position: absolute;
    top: 25px;
    left: 30px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.home-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

h1 {
    font-size: 2.2rem;
    font-weight: 800;
    margin-top: 50px;
    margin-bottom: 35px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* أزرار التحكم */
button.action-btn {
    width: 240px;
    height: 54px;
    font-size: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

button.action-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(139, 92, 246, 0.45);
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
}

/* النافذة المنبثقة Modal */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(4, 7, 13, 0.82);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

.modal-content {
    background: #0f172a;
    width: 90%;
    max-width: 460px;
    padding: 32px;
    border-radius: 20px;
    margin: 50px auto;
    text-align: left;
    color: var(--text-main);
    position: relative;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
}

.close {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
    cursor: pointer;
    color: var(--text-muted);
    transition: 0.2s;
}

.close:hover { color: white; }

label {
    font-weight: 600;
    display: block;
    margin-top: 16px;
    color: #d1d5db;
    font-size: 13px;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    background: #1e293b;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    outline: none;
    transition: all 0.2s ease;
    font-size: 14px;
    color: white;
}

select option {
    background: #1e293b;
    color: white;
}

input:focus, select:focus {
    border-color: var(--accent-purple);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
}

.save-btn {
    width: 100%;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 25px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s ease;
}

.save-btn:hover {
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
}

/* جدول سجلات الإدارة */
.logs-container {
    display: none;
    max-width: 1100px;
    margin: 40px auto;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    color: white;
    padding: 28px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    text-align: left;
}

.logs-container h2 {
    color: #ffffff;
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
}

.table-wrapper { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }

th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); text-align: left; font-size: 13.5px; }

th {
    background-color: rgba(255, 255, 255, 0.03);
    color: #c084fc;
    font-weight: 700;
}

td { color: #e5e7eb; }

.ticket-badge {
    color: #c084fc;
    font-weight: 700;
    background: rgba(139, 92, 246, 0.15);
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid rgba(139, 92, 246, 0.3);
    display: inline-block;
}

.delete-btn {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.delete-btn:hover {
    background: #dc2626;
    color: white;
}

/* تخصيص SweetAlert2 */
.custom-swal-popup {
    background: #0f172a !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 16px !important;
    color: white !important;
}

.custom-swal-title {
    color: #ffffff !important;
}
</style>
</head>

<body>

<a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

<h1><i class="fa-solid fa-network-wired"></i> Submit Request to Network Administrator</h1>

<button class="action-btn" onclick="openForm()">
    <i class="fa-solid fa-paper-plane"></i> New Submit
</button>

<div id="myForm" class="modal">
    <div class="modal-content">

        <span class="close" onclick="closeForm()">&times;</span>

        <h2 style="margin-top:0; color:#ffffff; font-size: 20px;"><i class="fa-solid fa-ticket"></i> Submit Ticket</h2>

        <form id="adminForm" onsubmit="handleSubmit(event)">
            <label><i class="fa-solid fa-microchip"></i> Device Type</label>
            <select id="field_device" required>
                <option value="">-- Select system --</option>
                <option>Security Cameras</option>
                <option>LAN/WAN Networks</option>
                <option>Setting Up VLANs</option>
                <option>Windows Server</option>
                <option>Firewall and Security</option>
                <option>Other</option>
            </select>

            <label><i class="fa-solid fa-user"></i> Customer Name</label>
            <input type="text" id="field_name" placeholder="Enter customer full name" required>

            <label><i class="fa-solid fa-phone"></i> Phone Number</label>
            <input type="text" id="field_phone" placeholder="Enter phone number" required>

            <label><i class="fa-solid fa-location-dot"></i> Location</label>
            <input type="text" id="field_location" placeholder="Enter location" required>

            <label><i class="fa-solid fa-file-lines"></i> System Details</label>
            <input type="text" id="field_details" placeholder="Describe the issue" required>

            <button type="submit" class="save-btn">Send Request</button>
        </form>

    </div>
</div>

<div class="logs-container" id="adminSection">
    <h2><i class="fa-solid fa-user-gear"></i> Administration Tasks Terminal (Global Web System)</h2>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Ticket Code</th>
                    <th>Device</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Location</th>
                    <th>Problem Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="logsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBV93xGbKln5RcaPP9VOTlmh5auKD04Zms",
    authDomain: "creatitity-d09f7.firebaseapp.com",
    databaseURL: "https://creatitity-d09f7-default-rtdb.firebaseio.com",
    projectId: "creatitity-d09f7",
    storageBucket: "creatitity-d09f7.appspot.com",
    messagingSenderId: "591631410491",
    appId: "1:591631410491:web:ff000c0a8d2f030f57031e"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

document.addEventListener("DOMContentLoaded", () => {
    const isAdmin = sessionStorage.getItem("isAdmin");
    if (isAdmin === "true") {
        document.getElementById("adminSection").style.display = "block";
        listenToLiveRequests();
    }
});

function openForm(){
    document.getElementById("myForm").style.display = "block";
}

function closeForm(){
    document.getElementById("myForm").style.display = "none";
    document.getElementById("adminForm").reset();
}

window.onclick = function(event){
    let modal = document.getElementById("myForm");
    if(event.target == modal){ closeForm(); }
}

function handleSubmit(event) {
    event.preventDefault();
    const ticketId = "ADM-" + Math.floor(1000 + Math.random() * 9000);

    const requestData = {
        dbId: ticketId,
        device: document.getElementById("field_device").value,
        name: document.getElementById("field_name").value,
        phone: document.getElementById("field_phone").value,
        location: document.getElementById("field_location").value,
        details: document.getElementById("field_details").value
    };

    database.ref('administration/' + ticketId).set(requestData)
    .then(() => {
        closeForm();
        Swal.fire({
            title: 'Request Sent Successfully!',
            text: `Admin Ticket created with Code: ${ticketId}`,
            icon: 'success',
            customClass: {
                popup: 'custom-swal-popup',
                title: 'custom-swal-title'
            }
        });
    });
}

function listenToLiveRequests() {
    database.ref('administration').on('value', (snapshot) => {
        const tableBody = document.getElementById("logsTableBody");
        tableBody.innerHTML = "";
        const data = snapshot.val();
        
        if (!data) {
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No admin tasks registered in the cloud database.</td></tr>`;
            return;
        }

        Object.keys(data).forEach(key => {
            const req = data[key];
            tableBody.innerHTML += `
                <tr>
                    <td><span class="ticket-badge">${req.dbId || ''}</span></td>
                    <td><strong>${req.device}</strong></td>
                    <td>${req.name}</td>
                    <td>${req.phone}</td>
                    <td>${req.location}</td>
                    <td>${req.details}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteLiveTicket('${req.dbId}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
            `;
        });
    });
}

function deleteLiveTicket(id) {
    Swal.fire({
        title: 'Delete admin log?',
        text: "This deletes the ticket from the global cloud servers completely!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Yes, Delete Ticket',
        cancelButtonText: 'Cancel',
        customClass: {
            popup: 'custom-swal-popup',
            title: 'custom-swal-title'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            database.ref('administration/' + id).remove()
            .then(() => {
                Swal.fire({
                    title: 'Deleted!',
                    text: 'Admin task successfully cleared.',
                    icon: 'success',
                    customClass: {
                        popup: 'custom-swal-popup',
                        title: 'custom-swal-title'
                    }
                });
            });
        }
    });
}
</script>
</body>
</html>
