<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us</title>

<!-- استدعاء خط عصري واستيقونات FontAwesome -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --accent-color: #7c3aed;
    --accent-hover: #6d28d9;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --border-color: #e2e8f0;
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 0;
    margin: 0;
}

/* Container للتجاوب */
.container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 0;
}

/* الهيدر والعنوان */
header {
    text-align: center;
    padding: 30px 20px 10px;
}

.page-title {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    color: var(--accent-color);
    letter-spacing: -0.5px;
    margin-bottom: 10px;
}



/* قسم التعريف (About) */
.about {
    max-width: 800px;
    margin: 30px auto;
    background: var(--card-bg);
    padding: clamp(24px, 5vw, 40px);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    text-align: center;
}

.about h2 {
    color: var(--accent-color);
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    font-weight: 700;
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

.about p {
    font-size: clamp(1rem, 2vw, 1.125rem);
    color: var(--text-secondary);
    line-height: 1.8;
}

/* معرض الصور */
.gallery-section {
    padding: 20px 0 60px;
}

.gallery-section h3 {
    text-align: center;
    font-size: 1.5rem;
    color: var(--text-primary);
    margin-bottom: 24px;
    font-weight: 700;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.gallery-item {
    overflow: hidden;
    border-radius: 16px;
    background: var(--card-bg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    aspect-ratio: 4 / 3;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.gallery-item:hover img {
    transform: scale(1.08);
}

/* الفوتر */
footer {
    background: var(--card-bg);
    color: var(--text-secondary);
    text-align: center;
    padding: 24px 20px;
    border-top: 1px solid var(--border-color);
    font-size: 0.95rem;
    font-weight: 500;
}

/* تحسين للشاشات الصغيرة جداً */
@media (max-width: 480px) {
    .hero-img {
        aspect-ratio: 4 / 3;
        border-radius: 14px;
    }
    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1 class="page-title">About Us</h1>
</header>


<main class="container">
    <section class="about">
        <h2><i class="fa-solid fa-users"></i> Who We Are</h2>
        <p>
            Welcome to our website. We are passionate about providing
            excellent services and creating innovative solutions that help
            our customers achieve their goals. Our team is dedicated to
            quality, creativity, and customer satisfaction.
        </p>
    </section>

    <section class="gallery-section">
        
        <div class="gallery">
            <div class="gallery-item"><img src="A.webp" alt="Gallery Image 1"></div>
            <div class="gallery-item"><img src="F.webp" alt="Gallery Image 2"></div>
            <div class="gallery-item"><img src="c.webp" alt="Gallery Image 3"></div>
            <div class="gallery-item"><img src="E.webp" alt="Gallery Image 4"></div>
            <div class="gallery-item"><img src="b.webp" alt="Gallery Image 5"></div>
        </div>
    </section>
</main>

<footer>
    © 2026 All Rights Reserved
</footer>

</body>
</html>
