<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Management System</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
:root {
    --bg-dark: #080d1a;
    --card-bg: rgba(15, 23, 42, 0.75);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent-orange: #f97316;
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --accent-red: #ef4444;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}

* {
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
}

body {
    text-align: center;
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(circle at 80% 15%, rgba(249, 115, 22, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 35px 35px, 35px 35px;
    background-attachment: fixed;
    color: var(--text-main);
    padding: 40px 20px;
    min-height: 100vh;
    position: relative;
}

.home-btn {
    position: absolute;
    top: 25px;
    left: 30px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.home-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

h1 {
    font-size: 2.2rem;
    font-weight: 800;
    margin-top: 50px;
    margin-bottom: 35px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 30%, #fdba74 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.btn-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 50px;
}

button.main-btn {
    width: 240px;
    height: 54px;
    font-size: 15px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: white;
    letter-spacing: 0.2px;
}

.btn-new {
    background: linear-gradient(135deg, #ea580c, #c2410c);
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-cancel {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
}

button.main-btn:hover {
    transform: translateY(-3px);
}

.btn-new:hover {
    box-shadow: 0 12px 25px rgba(234, 88, 12, 0.4);
    background: linear-gradient(135deg, #c2410c, #9a3412);
}

.btn-cancel:hover {
    background: rgba(239, 68, 68, 0.25);
    border-color: rgba(239, 68, 68, 0.5);
    color: white;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(4, 7, 13, 0.82);
    backdrop-filter: blur(10px);
    z-index: 1000;
    overflow-y: auto;
}

.modal-content {
    background: #0f172a;
    width: 90%;
    max-width: 480px;
    padding: 32px;
    border-radius: 20px;
    margin: 40px auto;
    text-align: left;
    color: var(--text-main);
    position: relative;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    animation: pop 0.3s ease-out;
}

@keyframes pop {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
    cursor: pointer;
    color: var(--text-muted);
    transition: 0.2s;
}

.close:hover { color: white; }

label {
    font-weight: 600;
    display: block;
    margin-top: 16px;
    color: #d1d5db;
    font-size: 13px;
}

input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    background: #1e293b;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    outline: none;
    transition: all 0.2s ease;
    font-size: 14px;
    color: white;
}

select option {
    background: #1e293b;
    color: white;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--accent-orange);
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
}

textarea { resize: vertical; height: 80px; }

.save-btn {
    width: 100%;
    background: linear-gradient(135deg, #ea580c, #c2410c);
    color: white;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 25px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s ease;
}

.save-btn:hover {
    background: linear-gradient(135deg, #c2410c, #9a3412);
}

.payment-box {
    background: rgba(249, 115, 22, 0.08);
    border: 1px solid rgba(249, 115, 22, 0.3);
    border-radius: 14px;
    padding: 16px;
    margin-top: 20px;
}

.payment-box h3 {
    font-size: 14px;
    color: #fdba74;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.payment-box p {
    font-size: 12.5px;
    color: #cbd5e1;
    line-height: 1.5;
}

.payment-number {
    display: inline-block;
    background: #1e293b;
    padding: 2px 8px;
    border-radius: 6px;
    color: #facc15;
    font-weight: 700;
}

.logs-container {
    display: none;
    max-width: 1100px;
    margin: 30px auto;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    color: white;
    padding: 28px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    text-align: left;
}

.logs-container h2 {
    color: #ffffff;
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
}

.table-wrapper { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }

th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); text-align: left; font-size: 13.5px; }

th {
    background-color: rgba(255, 255, 255, 0.03);
    color: #fdba74;
    font-weight: 700;
}

td { color: #e5e7eb; }

.badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-block; }

.badge-new { background: rgba(249, 115, 22, 0.18); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
.badge-cancel { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

.delete-btn {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.delete-btn:hover {
    background: #dc2626;
    color: white;
}

.custom-swal-popup {
    background: #0f172a !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 16px !important;
    color: white !important;
}

.custom-swal-title {
    color: #ffffff !important;
}
</style>
</head>

<body>

<a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

<h1><i class="fa-solid fa-wrench"></i> Maintenance Request System</h1>

<div class="btn-container">
    <button class="main-btn btn-new" onclick="openForm('new')">
        <i class="fa-solid fa-plus"></i> New Request
    </button>
    <button class="main-btn btn-cancel" onclick="openForm('cancel')">
        <i class="fa-solid fa-trash-can"></i> Cancel Old Request
    </button>
</div>

<div id="myForm" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeForm()">&times;</span>
        <h2 id="modalTitle" style="margin-top: 0; color: #ffffff;"><i class="fa-solid fa-file-invoice"></i> Request Details</h2>
        <form id="installationForm" onsubmit="handleSubmit(event)">
            <div id="dynamicFields"></div>
            <button type="submit" id="submitBtn" class="save-btn">Send Request</button>
        </form>
    </div>
</div>

<div class="logs-container" id="adminSection">
    <h2><i class="fa-solid fa-folder-open"></i> Maintenance Queues Logs (Global Web System)</h2>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Identifier / Device</th>
                    <th>Customer Name</th>
                    <th>Phone / Contact</th>
                    <th>Location</th>
                    <th>Payment Info</th>
                    <th>Details / Reasons</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="logsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBV93xGbKln5RcaPP9VOTlmh5auKD04Zms",
    authDomain: "creatitity-d09f7.firebaseapp.com",
    databaseURL: "https://creatitity-d09f7-default-rtdb.firebaseio.com",
    projectId: "creatitity-d09f7",
    storageBucket: "creatitity-d09f7.appspot.com",
    messagingSenderId: "591631410491",
    appId: "1:591631410491:web:ff000c0a8d2f030f57031e"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let currentType = 'new';

document.addEventListener("DOMContentLoaded", () => {
    const isAdmin = sessionStorage.getItem("isAdmin");
    if (isAdmin === "true") {
        document.getElementById("adminSection").style.display = "block";
        listenToLiveRequests();
    }
});

function openForm(type){
    currentType = type;
    const modal = document.getElementById("myForm");
    const title = document.getElementById("modalTitle");
    const submitBtn = document.getElementById("submitBtn");
    const dynamicFields = document.getElementById("dynamicFields");
    
    modal.style.display = "block";
    
    if(type === 'new') {
        title.innerHTML = `<i class="fa-solid fa-plus-circle"></i> New Maintenance Request`;
        submitBtn.innerHTML = `Submit Ticket`;
        submitBtn.style.background = "linear-gradient(135deg, #ea580c, #c2410c)";
        
        dynamicFields.innerHTML = `
            <label><i class="fa-solid fa-microchip"></i> Device / System Type</label>
            <select id="field_device" required>
                <option value="">-- Select Device --</option>
                <option>Security Cameras</option>
                <option>LAN/WAN Networks</option>
                <option>VLANs</option>
                <option>Windows Server</option>
                <option>Firewall and Security</option>
                <option>Other</option>
            </select>
            <label><i class="fa-solid fa-user"></i> Customer Name</label>
            <input type="text" id="field_name" placeholder="Enter customer full name" required>
            <label><i class="fa-solid fa-phone"></i> Phone Number</label>
            <input type="text" id="field_phone" placeholder="Enter phone number" required>
            <label><i class="fa-solid fa-location-dot"></i> Location</label>
            <input type="text" id="field_location" placeholder="Enter installation location" required>
            <label><i class="fa-solid fa-comment-dots"></i> Problem Description / Notes</label>
            <textarea id="field_details" placeholder="Enter any specific requirements..." required></textarea>

            <div class="payment-box">
                <h3><i class="fa-solid fa-wallet"></i> Payment Details</h3>
                <p>Transfer confirmation fee to wallet: <span class="payment-number">01144997914</span></p>
                
                <label><i class="fa-solid fa-mobile-screen"></i> Transferring Phone Number</label>
                <input type="text" id="field_pay_sender" placeholder="Phone number used for transfer" required>
                
                <label><i class="fa-solid fa-receipt"></i> Transaction / Reference ID</label>
                <input type="text" id="field_pay_tx" placeholder="Enter transaction reference code" required>
            </div>
        `;
    } else {
        title.innerHTML = `<i class="fa-solid fa-ban"></i> Cancel Request`;
        submitBtn.innerHTML = `Confirm Cancellation`;
        submitBtn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";
        
        dynamicFields.innerHTML = `
            <label><i class="fa-solid fa-hashtag"></i> Ticket Code ID to Cancel</label>
            <input type="text" id="field_device" placeholder="Enter Ticket Code (e.g. MAIN-7429)" required>
            <label><i class="fa-solid fa-user"></i> Registered Customer Name</label>
            <input type="text" id="field_name" placeholder="Enter name to confirm identity" required>
            <label><i class="fa-solid fa-phone"></i> Contact Phone</label>
            <input type="text" id="field_phone" placeholder="Enter contact phone number" required>
            <label><i class="fa-solid fa-location-dot"></i> Assigned Location</label>
            <input type="text" id="field_location" placeholder="Confirm original location" required>
            <label><i class="fa-solid fa-triangle-exclamation"></i> Reason for Cancellation</label>
            <textarea id="field_details" placeholder="Please let us know why you want to cancel..." required></textarea>
        `;
    }
}

function closeForm(){
    document.getElementById("myForm").style.display = "none";
    document.getElementById("installationForm").reset();
}

window.onclick = function(event){
    let modal = document.getElementById("myForm");
    if(event.target == modal){ closeForm(); }
}

function handleSubmit(event) {
    event.preventDefault(); 
    const ticketId = "MAIN-" + Math.floor(1000 + Math.random() * 9000);

    const requestData = {
        dbId: ticketId,
        type: currentType,
        device: document.getElementById("field_device").value,
        name: document.getElementById("field_name").value,
        phone: document.getElementById("field_phone").value,
        location: document.getElementById("field_location").value,
        details: document.getElementById("field_details").value,
        paySender: currentType === 'new' ? document.getElementById("field_pay_sender").value : 'N/A',
        payTx: currentType === 'new' ? document.getElementById("field_pay_tx").value : 'N/A'
    };

    database.ref('maintenance/' + ticketId).set(requestData)
    .then(() => {
        closeForm(); 
        Swal.fire({
            title: 'Cloud Received!',
            text: `Maintenance ticket registered globally with ID: ${ticketId}`,
            icon: 'success',
            customClass: {
                popup: 'custom-swal-popup',
                title: 'custom-swal-title'
            }
        });
    });
}

function listenToLiveRequests() {
    database.ref('maintenance').on('value', (snapshot) => {
        const tableBody = document.getElementById("logsTableBody");
        tableBody.innerHTML = ""; 
        const data = snapshot.val();
        
        if (!data) {
            tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-muted);">No maintenance requests active.</td></tr>`;
            return;
        }

        Object.keys(data).forEach(key => {
            const req = data[key];
            const typeBadge = req.type === 'new' ? '<span class="badge badge-new">NEW</span>' : '<span class="badge badge-cancel">CANCEL</span>';
            const payInfo = req.type === 'new' ? `<small style="color:#facc15;">From: ${req.paySender || '-'}</small><br><small style="color:var(--text-muted);">Tx: ${req.payTx || '-'}</small>` : 'N/A';

            const row = `
                <tr>
                    <td>${typeBadge} <br><small style="color:var(--text-muted); font-weight:600;">${req.dbId || ''}</small></td>
                    <td><strong>${req.device}</strong></td>
                    <td>${req.name}</td>
                    <td>${req.phone}</td>
                    <td>${req.location}</td>
                    <td>${payInfo}</td>
                    <td>${req.details}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteLiveTicket('${req.dbId}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    });
}

function deleteLiveTicket(id) {
    Swal.fire({
        title: 'Delete maintenance log?',
        text: "This deletes the data for all users globally!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Yes, Wipe Log',
        cancelButtonText: 'Cancel',
        customClass: {
            popup: 'custom-swal-popup',
            title: 'custom-swal-title'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            database.ref('maintenance/' + id).remove()
            .then(() => {
                Swal.fire({
                    title: 'Deleted!',
                    text: 'Ticket removed from system servers.',
                    icon: 'success',
                    customClass: {
                        popup: 'custom-swal-popup',
                        title: 'custom-swal-title'
                    }
                });
            });
        }
    });
}
</script>
</body>
</html>
